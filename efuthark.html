<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Futhark cheat sheet</title>
    <style>
        :root {
            --text: black;
            --inverse: white;
            --gray: #333;
            --background: #f2f2f2;
            --border: #ddd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: white;
                --inverse: black;
                --gray: #ccc;
                --background: #222;
                --border: #666;
            }
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: var(--text);
            background-color: var(--background);
        }

        h1 {
            color: var(--gray);
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            table-layout: fixed;
        }

        th,
        td {
            min-width: 0.5in;
            padding: 4px;
            text-align: center;
        }

        th {
            background-color: var(--background);
        }

        .futhark {
            width: 1in;
            border: 1px solid var(--border);
            font-family: "Segoe UI Symbol", "Noto Sans Symbols", "Arial Unicode MS", sans-serif;
            font-size: 44px;
            font-weight: 900;
            color: var(--inverse);
            text-shadow: 0px 0px 3px var(--text),
                0px 0px 3px var(--text),
                0px 0px 3px var(--text),
                0px 0px 3px var(--text),
                0px 0px 2px var(--text);
        }

        .futhark.big {
            padding: 0px;
            font-size: 52px;
        }

        .latin {
            width: 1in;
            border: 1px solid var(--border);
            font-family: Arial, sans-serif;
            font-size: 36px;
            color: var(--text);
        }

        .futhark svg {
            width: 50px;
            height: 50px;
            fill: none;
        }

        path {
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
