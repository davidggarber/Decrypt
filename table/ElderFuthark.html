<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elder Futhark cheat sheet</title>
        <style>
            :root {
                --text: black;
                --inverse: white;
                --gray: #333;
                --background: #f2f2f2;
                --border: #ddd;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --text: white;
                    --inverse: black;
                    --gray: #ccc;
                    --background: #222;
                    --border: #666;
                }
            }

            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                color: var(--text);
                background-color: var(--background);
            }
            h1 {
                color: var(--gray);
            }
            table {
                border-collapse: collapse;
                margin-top: 20px;
                table-layout: fixed;
            }
            th, td {
                min-width: 0.5in;
                padding: 4px;
                text-align: center;
            }
            th {
                background-color: var(--background);
            }
            .futhark {
                width: 1in;
                border: 1px solid var(--border);
                font-family: "Segoe UI Symbol", "Noto Sans Symbols", "Arial Unicode MS", sans-serif;
                font-size: 44px;
                font-weight: 900;
                color: var(--inverse);
                text-shadow: 0px 0px 3px var(--text),
                            0px 0px 3px var(--text),
                            0px 0px 3px var(--text),
                            0px 0px 3px var(--text),
                            0px 0px 2px var(--text);
            }
            .futhark.big {
                padding: 0px;
                font-size: 52px;
            }
            .latin {
                width: 1in;
                border: 1px solid var(--border);
                font-family: Arial, sans-serif;
                font-size: 36px;
                color: var(--text);
            }
        </style>
    </head>
    <body>
        <h1>Elder Futhark cheat sheet</h1>
        <p>This table is a simplified summary of the <a href="https://en.wikipedia.org/wiki/Elder_Futhark">Wikipedia article</a>.</p>
        <table>
            <tr>
                <th>Futhark</th>
                <th>Latin</th>
                <td>&nbsp;</td>
                <th>Futhark</th>
                <th>Latin</th>
                <td>&nbsp;</td>
                <th>Futhark</th>
                <th>Latin</th>
            </tr>
            <tr>
                <td class="futhark">ᚠ</td><td class="latin">F</td>
                <td>&nbsp;</td>
                <td class="futhark">ᚺ</td><td class="latin">H</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛏ</td><td class="latin">T</td>
            </tr>
            <tr>
                <td class="futhark">ᚢ</td><td class="latin">U</td>
                <td>&nbsp;</td>
                <td class="futhark">ᚾ</td><td class="latin">N</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛒ</td><td class="latin">B</td>
            </tr>
            <tr>
                <td class="futhark">ᚦ</td><td class="latin">TH</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛁ</td><td class="latin">I</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛖ</td><td class="latin">E</td>
            </tr>
            <tr>
                <td class="futhark">ᚨ</td><td class="latin">A</td>
                <td>&nbsp;</td>
                <td class="futhark big">ᛃ</td><td class="latin">J</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛗ</td><td class="latin">M</td>
            </tr>
            <tr>
                <td class="futhark">ᚱ</td><td class="latin">R</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛈ</td><td class="latin">P</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛚ</td><td class="latin">L</td>
            </tr>
            <tr>
                <td class="futhark big">ᚲ</td><td class="latin">K</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛇ</td><td class="latin">Ï</td>
                <td>&nbsp;</td>
                <td class="futhark big">ᛜ</td><td class="latin">NG</td>
            </tr>
            <tr>
                <td class="futhark">ᚷ</td><td class="latin">G</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛉ</td><td class="latin">Z</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛞ</td><td class="latin">D</td>
            </tr>
            <tr>
                <td class="futhark">ᚹ</td><td class="latin">W</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛊ</td><td class="latin">S</td>
                <td>&nbsp;</td>
                <td class="futhark">ᛟ</td><td class="latin">O</td>
            </tr>

        </table>

    </body>
</html>
